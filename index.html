<!doctype html>
<html lang="en" data-theme="nord">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Hot Take</title>

  <!--
      THE THREE TAGS. Tailwind and daisyUI, no build step, nothing installed.
      Open this file with Live Server and start working.

      Two honest notes:
        1. The last tag is Tailwind's BROWSER build. Tailwind's own docs say it
           is "designed for development purposes only, and is not intended for
           production." That is fine for now. Unit 8 replaces it with a real
           built stylesheet, because publishing to a public address is where
           "development only" stops being acceptable.
        2. These load from jsdelivr, which means jsdelivr sees a request from
           every reader of your site. That is your call to make on your own
           project. Read Unit 8's "what a page costs its reader" before you
           decide it does not matter.
    -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Your own rules go last, so they win. See styles.css. -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-base-100 text-base-content">
  <div class="hero min-h-screen"
    style="background-image: url(https://img.daisyui.com/images/stock/photo-1507358522600-9f71e620c44e.webp);">
    <div class="hero-overlay"></div>
    <div class="hero-content text-neutral-content text-center">
      <div class="max-w-md">
        <h1 class="mb-5 text-5xl font-bold">Hello there</h1>
        <p class="mb-5">
          Provident cupiditate voluptatem et in. Quaerat fugiat ut assumenda excepturi exercitationem
          quasi. In deleniti eaque aut repudiandae et a id nisi.
        </p>
        <button class="btn btn-primary">Get Started</button>
      </div>
    </div>
  </div>

</body>

</html>
